name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    name: Build and smoke-test packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install packaging tools
        run: python -m pip install -U pip && python -m pip install -e '.[dev]'
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Verify tagged release version
        if: startsWith(github.ref, 'refs/tags/v0.1.0')
        run: |
          test "$(python -c 'import pyjev; print(pyjev.__version__)')" = "0.1.0"
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import tarfile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and wheels[0].name.startswith("pyjev-0.1.0-")
          assert len(sdists) == 1 and sdists[0].name == "pyjev-0.1.0.tar.gz"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "pyjev/py.typed" in names
          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/pyjev/py.typed") for name in names)
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/pyjev-wheel-env
          /tmp/pyjev-wheel-env/bin/python -m pip install dist/*.whl
          /tmp/pyjev-wheel-env/bin/pyjev --version
          /tmp/pyjev-wheel-env/bin/pyjev --help
          /tmp/pyjev-wheel-env/bin/pyjev decision --help
          /tmp/pyjev-wheel-env/bin/python -c "import pyjev; print(pyjev.__version__)"
